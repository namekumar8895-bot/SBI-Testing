<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Facebook - App Page</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #fff;
      color: #202124;
    }

    .topbar {
      height: 75px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px;
    }

    .back {
      font-size: 38px;
      font-weight: 300;
      color: #555;
    }

    .menu {
      font-size: 30px;
      letter-spacing: 4px;
      transform: rotate(90deg);
      color: #555;
    }

    .app-header {
      display: flex;
      padding: 8px 22px 20px;
      gap: 25px;
      align-items: center;
    }

    .app-icon {
      width: 140px;
      height: 140px;
      border-radius: 30px;
      background: #1877f2;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      flex-shrink: 0;
    }

    .app-icon span {
      color: white;
      font-family: Arial, sans-serif;
      font-size: 112px;
      font-weight: bold;
      line-height: 1;
      transform: translateY(13px);
    }

    .app-info h1 {
      font-size: 40px;
      font-weight: 500;
      margin-bottom: 8px;
    }

    .developer {
      color: #2874c6;
      font-size: 25px;
      margin-bottom: 10px;
    }

    .details {
      color: #666;
      font-size: 20px;
    }

    .buttons {
      display: flex;
      gap: 22px;
      padding: 5px 22px 25px;
    }

    button {
      height: 68px;
      border-radius: 35px;
      font-size: 23px;
      font-weight: 500;
      flex: 1;
      cursor: pointer;
    }

    .uninstall {
      background: white;
      border: 2px solid #ddd;
      color: #1769c2;
    }

    .update {
      background: #1769d1;
      border: none;
      color: white;
    }

    .similar {
      margin: 0 22px;
      padding: 18px 0 25px;
      display: flex;
      gap: 18px;
      align-items: flex-start;
    }

    .info-icon {
      width: 28px;
      height: 28px;
      border: 2px solid #777;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #555;
      font-weight: bold;
      font-size: 17px;
      flex-shrink: 0;
    }

    .similar-text {
      font-size: 21px;
      color: #666;
      line-height: 1.5;
    }

    .similar-text strong {
      display: block;
      color: #555;
      font-size: 24px;
    }

    .view {
      color: #222;
      font-weight: bold;
      margin-top: 3px;
    }

    .ask-box {
      margin: 0 22px 40px;
      background: #f1f5f9;
      border-radius: 32px;
      padding: 22px;
    }

    .ask-title {
      font-size: 22px;
      margin-bottom: 25px;
    }

    .new {
      background: #b8e9c5;
      color: #216c35;
      padding: 4px 9px;
      border-radius: 12px;
      font-size: 16px;
    }

    .question {
      background: white;
      border-radius: 35px;
      padding: 20px 28px;
      color: #666;
      font-size: 19px;
      margin-bottom: 20px;
      white-space: nowrap;
      overflow: hidden;
    }

    .suggestion {
      background: #c7e7ff;
      color: #075b8e;
      border-radius: 30px;
      padding: 18px 28px;
      font-size: 19px;
      margin-top: 15px;
      white-space: nowrap;
      overflow: hidden;
    }

    .rating {
      padding: 0 22px 30px;
    }

    .rating h2 {
      font-size: 27px;
      margin-bottom: 6px;
      font-weight: 500;
    }

    .rating p {
      color: #666;
      font-size: 18px;
      margin-bottom: 20px;
    }

    .stars {
      display: flex;
      justify-content: space-between;
      padding: 0 8px;
    }

    .star {
      font-size: 48px;
      color: #777;
    }
